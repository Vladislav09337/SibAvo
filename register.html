<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — SibAvto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth__body">
    <div class="auth">
        <div class="auth__card">
            <a href="index.html" class="auth__logo">SibAvto</a>
            <h1 class="auth__title">Регистрация</h1>
            <form class="auth__form">
                <input type="text" placeholder="ФИО" required>
                <input type="tel" placeholder="Телефон" required>
                <input type="email" placeholder="E-mail" required>
                <input type="password" placeholder="Пароль" required>
                <input type="password" placeholder="Повтор пароля" required>
                <button type="submit" class="btn btn--primary btn--full">Зарегистрироваться</button>
            </form>
            <p class="auth__link">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
        </div>
    </div>
</body>
</html>
