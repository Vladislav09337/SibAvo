<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Вход в личный кабинет SibAvto.">
    <title>Вход — SibAvto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth__body">
    <div class="auth">
        <div class="auth__card">
            <a href="index.html" class="auth__logo">Sib<span>Avto</span></a>
            <h1 class="auth__title">Вход в личный кабинет</h1>
            <form class="auth__form" id="loginForm">
                <input type="tel" id="loginPhone" placeholder="Телефон" required>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
                <button type="submit" class="btn btn--primary btn--full">Войти</button>
            </form>
            
            <div class="auth__links" style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 14px;">
                <a href="#" id="forgotPasswordBtn" style="color: #888; transition: color 0.2s;" onmouseover="this.style.color='#e63946'" onmouseout="this.style.color='#888'">Забыли пароль?</a>
                <p class="auth__link" style="margin: 0;">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>

    <!-- Модальное окно "Восстановление пароля" -->
    <div class="modal" id="forgotModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div style="background: #fff; padding: 32px; border-radius: 16px; max-width: 400px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); position: relative;">
            <button type="button" id="closeForgotModal" style="position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: #888;">✕</button>
            
            <!-- Шаг 1 -->
            <div id="step1">
                <div style="font-size: 40px; margin-bottom: 16px; text-align: center;">🔑</div>
                <h2 style="margin-bottom: 12px; color: #1a2332; font-size: 22px; text-align: center;">Восстановление</h2>
                <p style="font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.5; text-align: center;">Введите телефон или email, привязанный к аккаунту.</p>
                <form id="forgotFormStep1">
                    <input type="text" id="forgotContact" placeholder="Телефон или Email" required style="width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 20px; font-family: inherit; font-size: 15px; outline: none;">
                    <button type="submit" class="btn btn--primary btn--full" style="padding: 14px; font-size: 16px;">Получить код</button>
                </form>
            </div>

            <!-- Шаг 2 -->
            <div id="step2" style="display: none;">
                <div style="font-size: 40px; margin-bottom: 16px; text-align: center;">📩</div>
                <h2 style="margin-bottom: 12px; color: #1a2332; font-size: 22px; text-align: center;">Введите код</h2>
                <p style="font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.5; text-align: center;">Код отправлен на <strong id="sentToDisplay"></strong>. (Код в консоли F12)</p>
                <form id="forgotFormStep2">
                    <input type="text" id="forgotCode" placeholder="000000" maxlength="6" required style="width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 20px; font-family: inherit; font-size: 24px; text-align: center; letter-spacing: 8px; outline: none;">
                    <button type="submit" class="btn btn--primary btn--full" style="padding: 14px; font-size: 16px;">Проверить код</button>
                </form>
            </div>

            <!-- Шаг 3 -->
            <div id="step3" style="display: none;">
                <div style="font-size: 40px; margin-bottom: 16px; text-align: center;">🔒</div>
                <h2 style="margin-bottom: 12px; color: #1a2332; font-size: 22px; text-align: center;">Новый пароль</h2>
                <p style="font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.5; text-align: center;">Придумайте новый пароль для входа.</p>
                <form id="forgotFormStep3">
                    <input type="password" id="newPassword" placeholder="Новый пароль" required minlength="6" style="width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 12px; font-family: inherit; font-size: 15px; outline: none;">
                    <input type="password" id="newPasswordConfirm" placeholder="Повторите пароль" required minlength="6" style="width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 20px; font-family: inherit; font-size: 15px; outline: none;">
                    <button type="submit" class="btn btn--primary btn--full" style="padding: 14px; font-size: 16px;">Сохранить пароль</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/chat-bot.js"></script>
</body>
</html>
