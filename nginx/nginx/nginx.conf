events {}

http {
    upstream sibavto_app {
        server app:3000;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name sibavto.localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name sibavto.localhost;

        ssl_certificate     /etc/nginx/certs/sibavto.localhost.pem;
        ssl_certificate_key /etc/nginx/certs/sibavto.localhost-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://sibavto_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}