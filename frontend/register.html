<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Регистрация в SibAvto.">
    <title>Регистрация — SibAvto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth__body">
    <div class="auth">
        <div class="auth__card">
            <a href="index.html" class="auth__logo">Sib<span>Avto</span></a>
            <h1 class="auth__title">Регистрация</h1>
            <form class="auth__form" id="registerForm">
                <input type="text" id="regFullName" placeholder="ФИО" required>
                <input type="tel" id="regPhone" placeholder="Телефон" required>
                <input type="email" id="regEmail" placeholder="E-mail" required>
                <input type="password" id="regPassword" placeholder="Пароль" required minlength="6">
                <input type="password" id="regPassword2" placeholder="Повтор пароля" required>

                <!-- Тип лица -->
                <div style="display: flex; gap: 16px; font-size: 14px; color: #555; margin-top: 4px;">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="radio" name="entityType" value="physical" checked> Физ. лицо
                    </label>
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="radio" name="entityType" value="legal"> Юр. лицо
                    </label>
                </div>

                <!-- Админ (для тестов) -->
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; margin-top: 8px; cursor: pointer;">
                    <input type="checkbox" id="isAdminReg"> Зарегистрироваться как администратор
                </label>

                <button type="submit" class="btn btn--primary btn--full" style="margin-top: 12px;">Зарегистрироваться</button>
            </form>
            <p class="auth__link">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/chat-bot.js"></script>
</body>
</html>
