services:
  app:
    build: .
    container_name: sibavto-app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    networks:
      - sibavto-net

  nginx:
    image: nginx:alpine
    container_name: sibavto-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - sibavto-net

networks:
  sibavto-net:
    driver: bridge